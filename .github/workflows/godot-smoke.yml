name: Godot Eden Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eden:
    name: Godot 4.7.2 Eden gameplay, progress and UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.2-stable"
          GODOT_FILE="Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p /tmp/godot
          cd /tmp/godot
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${GODOT_FILE}.zip" -o "${GODOT_FILE}.zip"
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          rg " ${GODOT_FILE}.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${GODOT_FILE}.zip"
          sudo install -m 755 "${GODOT_FILE}" /usr/local/bin/godot
          godot --version

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth

      - name: Validate Eden and capture gameplay
        shell: bash
        run: bash tools/check.sh --visual

      - name: Upload logs and UI captures
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-eden-results
          path: |
            godot-*.log
            ci_artifacts/*.png
          if-no-files-found: ignore
          retention-days: 1
