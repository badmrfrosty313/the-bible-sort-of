name: Godot Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Godot 4.7.2 headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.2-stable"
          GODOT_FILE="Godot_v4.7.2-stable_linux.x86_64"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${GODOT_FILE}.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_FILE}"
          sudo mv "/tmp/godot/${GODOT_FILE}" /usr/local/bin/godot
          godot --version

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --editor --path . --quit 2>&1 | tee godot-import.log

      - name: Parse and start main scene
        shell: bash
        run: |
          set -o pipefail
          timeout 12s godot --headless --path . 2>&1 | tee godot-smoke.log || status=$?
          status=${status:-0}
          # timeout(124) is expected because the game loop intentionally keeps running.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(parse|script|resource)" godot-smoke.log; then
            echo "Godot reported a script/resource failure."
            exit 1
          fi
          echo "Main scene survived the smoke window."

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-logs
          path: |
            godot-import.log
            godot-smoke.log
          if-no-files-found: ignore
          retention-days: 14
