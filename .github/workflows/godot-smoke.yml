name: Godot Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Godot 4.7.2 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.2-stable"
          GODOT_FILE="Godot_v4.7.2-stable_linux.x86_64"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${GODOT_FILE}.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_FILE}"
          sudo mv "/tmp/godot/${GODOT_FILE}" /usr/local/bin/godot
          godot --version

      - name: Import project resources
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --editor --path . --quit 2>&1 | tee godot-import.log

      - name: Parse and start main scene
        shell: bash
        run: |
          set -o pipefail
          timeout 12s godot --headless --path . 2>&1 | tee godot-smoke.log || status=$?
          status=${status:-0}
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(parse|script|resource)" godot-smoke.log; then
            echo "Godot reported a script/resource failure."
            exit 1
          fi
          echo "Main scene survived the smoke window."

      - name: Install virtual display
        if: success()
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb

      - name: Capture static menu and navigation snapshots
        if: success()
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          mkdir -p ci_artifacts
          timeout 50s xvfb-run -a godot \
            --path . \
            --rendering-method gl_compatibility \
            --script ci/capture_title.gd \
            2>&1 | tee godot-visual.log
          test -f ci_artifacts/01_title_menu.png
          test -f ci_artifacts/02_new_game_slots.png
          test -f ci_artifacts/03_prologue.png
          test -f ci_artifacts/04_load_slots.png
          test -f ci_artifacts/05_chapter_select.png
          test -f ci_artifacts/06_options.png
          test -f ci_artifacts/07_return_to_title.png

      - name: Capture Eden vertical slice
        if: success()
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 40s xvfb-run -a godot \
            --path . \
            --rendering-method gl_compatibility \
            --script ci/capture_eden.gd \
            2>&1 | tee godot-eden.log
          test -f ci_artifacts/08_eden_free_roam.png
          test -f ci_artifacts/09_eden_rock.png
          test -f ci_artifacts/10_eden_first_jeff.png
          test -f ci_artifacts/11_eve_sleep_line.png
          test -f ci_artifacts/12_eve_cow_payoff.png
          test -f ci_artifacts/13_eve_day.png
          test -f ci_artifacts/14_serpent_unlocked.png
          test -f ci_artifacts/15_fall_black_boxes.png
          test -f ci_artifacts/16_fall_leaves.png

      - name: Upload Godot logs
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-logs
          path: |
            godot-import.log
            godot-smoke.log
            godot-visual.log
            godot-eden.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload visual snapshots
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-visual-snapshots
          path: ci_artifacts/*.png
          if-no-files-found: ignore
          retention-days: 1
